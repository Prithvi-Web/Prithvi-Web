<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Toolkit — languages: TypeScript, HTML, Rust, JavaScript, CSS, Python. Tools and platforms: Node.js, Git &amp; GitHub, Docker, macOS, Windows, Linux">
  <defs>
    <linearGradient id="metal-sk" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="0.55" stop-color="#c8ccd8"/>
      <stop offset="1" stop-color="#8e93a6"/>
    </linearGradient>
    <radialGradient id="glow-sk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b46b8"/>
      <stop offset="1" stop-color="#2b46b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline-sk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen-sk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-sk"><rect width="1000" height="260" rx="28"/></clipPath></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    @keyframes tw-sk{0%,100%{opacity:.12}50%{opacity:.85}}
    .st-sk{animation:tw-sk 4.2s ease-in-out infinite}
    @keyframes pl-sk{0%,100%{opacity:.45}50%{opacity:.75}}
    .gl-sk{animation:pl-sk 8s ease-in-out infinite}
    @keyframes fu-sk{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
    .fu-sk{animation:fu-sk .8s cubic-bezier(.25,.1,.25,1) both}
    @keyframes fi-sk{0%{opacity:0}100%{opacity:1}}
    .fi-sk{animation:fi-sk .7s ease-out both}
    @keyframes fl-sk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .fl-sk{animation:fl-sk 6.5s ease-in-out infinite}
  </style>

  <g clip-path="url(#frame-sk)">
    <rect width="1000" height="260" fill="#000000"/>
    <g fill="#ffffff"><circle class="st-sk" cx="67" cy="125" r="1.1" style="animation-delay:-2.7s"/><circle class="st-sk" cx="853" cy="0" r="0.9" style="animation-delay:-2.5s"/><circle class="st-sk" cx="918" cy="256" r="1.5" style="animation-delay:-2s"/><circle class="st-sk" cx="216" cy="250" r="1.5" style="animation-delay:-3.1s"/><circle class="st-sk" cx="5" cy="37" r="1.4" style="animation-delay:-2.2s"/><circle class="st-sk" cx="140" cy="95" r="1.4" style="animation-delay:-2.9s"/><circle class="st-sk" cx="677" cy="129" r="1.1" style="animation-delay:-1.1s"/><circle class="st-sk" cx="843" cy="8" r="0.9" style="animation-delay:-4.1s"/><circle class="st-sk" cx="20" cy="241" r="1.2" style="animation-delay:-0.6s"/><circle class="st-sk" cx="867" cy="47" r="1.3" style="animation-delay:-3.2s"/><circle class="st-sk" cx="192" cy="68" r="1.5" style="animation-delay:-2.9s"/><circle class="st-sk" cx="177" cy="230" r="1.3" style="animation-delay:-1.8s"/></g>
    <ellipse class="gl-sk" cx="500" cy="310" rx="400" ry="140" fill="url(#glow-sk)" opacity="0.42"/>
    <text x="500" y="48" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="3" fill="#86868b">TOOLKIT</text>
    <text class="fi-sk" x="56" y="88" font-size="11" letter-spacing="1.6" fill="#86868b" style="animation-delay:.2s">LANGUAGES · BY BYTES SHIPPED</text>
    <g class="fu-sk" style="animation-delay:0.3s">
      <rect x="242" y="100" width="105" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="259" cy="119" r="4" fill="#7cc4ff"/>
      <text x="270" y="124" font-size="13" fill="#d5d5da">TypeScript</text>
    </g><g class="fu-sk" style="animation-delay:0.39s">
      <rect x="357" y="100" width="62" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="374" cy="119" r="4" fill="#2997ff"/>
      <text x="385" y="124" font-size="13" fill="#d5d5da">HTML</text>
    </g><g class="fu-sk" style="animation-delay:0.48s">
      <rect x="429" y="100" width="62" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="446" cy="119" r="4" fill="#2b6fe0"/>
      <text x="457" y="124" font-size="13" fill="#d5d5da">Rust</text>
    </g><g class="fu-sk" style="animation-delay:0.57s">
      <rect x="501" y="100" width="105" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="518" cy="119" r="4" fill="#3b4fc8"/>
      <text x="529" y="124" font-size="13" fill="#d5d5da">JavaScript</text>
    </g><g class="fu-sk" style="animation-delay:0.66s">
      <rect x="616" y="100" width="55" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="633" cy="119" r="4" fill="#5f3dc4"/>
      <text x="644" y="124" font-size="13" fill="#d5d5da">CSS</text>
    </g><g class="fu-sk" style="animation-delay:0.75s">
      <rect x="681" y="100" width="77" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="698" cy="119" r="4" fill="#7b3fb0"/>
      <text x="709" y="124" font-size="13" fill="#d5d5da">Python</text>
    </g>
    <text class="fi-sk" x="56" y="176" font-size="11" letter-spacing="1.6" fill="#86868b" style="animation-delay:.7s">TOOLS &amp; PLATFORMS</text>
    <g class="fu-sk" style="animation-delay:0.8s">
      <rect x="253" y="188" width="74" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      
      <text x="265" y="212" font-size="13" fill="#d5d5da">Node.js</text>
    </g><g class="fu-sk" style="animation-delay:0.89s">
      <rect x="337" y="188" width="109" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      
      <text x="349" y="212" font-size="13" fill="#d5d5da">Git &amp; GitHub</text>
    </g><g class="fu-sk" style="animation-delay:0.98s">
      <rect x="456" y="188" width="67" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      
      <text x="468" y="212" font-size="13" fill="#d5d5da">Docker</text>
    </g><g class="fu-sk" style="animation-delay:1.07s">
      <rect x="533" y="188" width="60" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      
      <text x="545" y="212" font-size="13" fill="#d5d5da">macOS</text>
    </g><g class="fu-sk" style="animation-delay:1.16s">
      <rect x="603" y="188" width="74" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      
      <text x="615" y="212" font-size="13" fill="#d5d5da">Windows</text>
    </g><g class="fu-sk" style="animation-delay:1.25s">
      <rect x="687" y="188" width="60" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
      
      <text x="699" y="212" font-size="13" fill="#d5d5da">Linux</text>
    </g>
    
  <g class="sh-sk"><rect x="-200" y="-52" width="110" height="364" fill="url(#sheen-sk)" transform="skewX(-14)"/></g>
  <style>@keyframes sw-sk{0%{transform:translateX(0)}55%,100%{transform:translateX(1320px)}}
  .sh-sk{animation:sw-sk 8.5s ease-in-out infinite;animation-delay:1.8s}</style>
  </g>
</svg>
