<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40" role="img" aria-label="">
  <defs><linearGradient id="rule-dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient></defs>
  <style>@keyframes tr-dv{0%{transform:translateX(120px);opacity:0}
      12%{opacity:1}88%{opacity:1}100%{transform:translateX(880px);opacity:0}}
    .pk-dv{animation:tr-dv 6s cubic-bezier(.45,0,.55,1) infinite}</style>

  <rect width="1000" height="40" fill="#000000"/>
  <rect x="60" y="20" width="880" height="1" fill="url(#rule-dv)"/>
  <g class="pk-dv">
    <circle cx="0" cy="20" r="2.5" fill="#2997ff"/>
    <circle cx="0" cy="20" r="7" fill="#2997ff" opacity="0.18"/>
  </g>
</svg>
