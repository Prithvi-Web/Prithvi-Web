<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Real products. No shortcuts. Dashboard rebuilt from the GitHub API at 29 Jul 2026, 14:30 UTC, refreshing automatically every 6 hours.">
  <defs>
    <linearGradient id="metal-ft" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="0.55" stop-color="#c8ccd8"/>
      <stop offset="1" stop-color="#8e93a6"/>
    </linearGradient>
    <radialGradient id="glow-ft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b46b8"/>
      <stop offset="1" stop-color="#2b46b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline-ft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen-ft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-ft"><rect width="1000" height="150" rx="28"/></clipPath></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    @keyframes tw-ft{0%,100%{opacity:.12}50%{opacity:.85}}
    .st-ft{animation:tw-ft 4.2s ease-in-out infinite}
    @keyframes pl-ft{0%,100%{opacity:.45}50%{opacity:.75}}
    .gl-ft{animation:pl-ft 8s ease-in-out infinite}
    @keyframes fu-ft{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
    .fu-ft{animation:fu-ft .8s cubic-bezier(.25,.1,.25,1) both}
    @keyframes fi-ft{0%{opacity:0}100%{opacity:1}}
    .fi-ft{animation:fi-ft .7s ease-out both}
    @keyframes fl-ft{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .fl-ft{animation:fl-ft 6.5s ease-in-out infinite}
  
    @keyframes lv-ft{0%,100%{opacity:.35}50%{opacity:1}}
    .live-ft{animation:lv-ft 2.4s ease-in-out infinite}</style>

  <g clip-path="url(#frame-ft)">
    <rect width="1000" height="150" fill="#000000"/>
    <g fill="#ffffff"><circle class="st-ft" cx="316" cy="128" r="1.2" style="animation-delay:-1.3s"/><circle class="st-ft" cx="77" cy="25" r="1" style="animation-delay:-0.4s"/><circle class="st-ft" cx="604" cy="45" r="1.2" style="animation-delay:-4.2s"/><circle class="st-ft" cx="44" cy="135" r="1.5" style="animation-delay:-3s"/><circle class="st-ft" cx="997" cy="2" r="0.9" style="animation-delay:-3.6s"/><circle class="st-ft" cx="388" cy="118" r="1.3" style="animation-delay:-0.5s"/><circle class="st-ft" cx="118" cy="86" r="1.4" style="animation-delay:-0.3s"/><circle class="st-ft" cx="537" cy="95" r="1.1" style="animation-delay:-1s"/><circle class="st-ft" cx="406" cy="149" r="1.3" style="animation-delay:-1.8s"/><circle class="st-ft" cx="75" cy="66" r="1.4" style="animation-delay:-4.1s"/></g>
    <ellipse class="gl-ft" cx="500" cy="180" rx="380" ry="120" fill="url(#glow-ft)" opacity="0.5"/>
    <text class="fu-ft" x="500" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="url(#metal-ft)" letter-spacing="-0.3" style="animation-delay:.2s">Real products. No shortcuts.</text>
    <g class="fi-ft" style="animation-delay:.7s">
      <circle class="live-ft" cx="352" cy="92" r="3.5" fill="#2997ff"/>
      <text x="364" y="96" font-size="12" fill="#86868b">Rebuilt from the GitHub API · 29 Jul 2026, 14:30 UTC</text>
    </g>
    <text class="fi-ft" x="500" y="122" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="#86868b" style="animation-delay:.9s">REFRESHES AUTOMATICALLY EVERY 6 HOURS</text>
    
  <g class="sh-ft"><rect x="-200" y="-30" width="110" height="210" fill="url(#sheen-ft)" transform="skewX(-14)"/></g>
  <style>@keyframes sw-ft{0%{transform:translateX(0)}55%,100%{transform:translateX(1320px)}}
  .sh-ft{animation:sw-ft 8s ease-in-out infinite;animation-delay:2s}</style>
  </g>
</svg>
