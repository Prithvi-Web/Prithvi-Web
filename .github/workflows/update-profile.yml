name: Update profile README

on:
  schedule:
    - cron: "0 * * * *"      # every hour, GitHub's practical minimum is about 5 minutes
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main, new-readme]

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Optional: add a classic PAT named METRICS_TOKEN (scopes: read:user, repo)
      # as a repo secret to include private contributions. Falls back to the
      # built-in token, which only sees public data.
      - name: Render stat cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python update_stats.py

      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#0a84ff&color_dots=#1c1c1e,#0e4429,#006d32,#26a641,#39d353
            assets/snake-dark.svg?palette=github-dark

      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh live stats"
          git push
